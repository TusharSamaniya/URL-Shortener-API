<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>🔗 URL Shortener</h1>
      <p class="subtitle">Paste a long link, get a short one.</p>
    </header>

    <section class="panel">
      <h2>Shorten a URL</h2>
      <form id="shorten-form">
        <input
          id="long-url"
          type="url"
          placeholder="https://example.com/very/long/path"
          aria-label="Long URL to shorten"
          required
        />
        <button type="submit">Shorten</button>
      </form>
      <div id="shorten-result" class="result hidden">
        <a id="short-link" class="short-link" target="_blank" rel="noopener"></a>
        <button id="copy-btn" class="ghost" type="button">Copy</button>
      </div>
    </section>

    <p id="error" class="error hidden" role="alert"></p>

    <footer>
      <p>Backend API docs: <a href="http://localhost:8000/docs" target="_blank" rel="noopener">/docs</a></p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
